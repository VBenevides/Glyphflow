name: SonarQube

on:
  push:
    branches:
      - main
      - "version/**"
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate backend coverage
        working-directory: backend
        run: go test ./... -coverprofile=coverage.out

      - name: Generate frontend coverage
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm test -- --coverage --coverage.reporter=lcov

      - name: Enforce 85 percent coverage
        run: |
          backend_coverage="$(cd backend && go tool cover -func=coverage.out | awk '$1 == "total:" {gsub("%", "", $NF); print $NF}')"
          frontend_coverage="$(awk -F '[,:]' '/^DA:/ {total++; covered += ($3 > 0)} END {if (total == 0) exit 1; printf "%.2f", covered * 100 / total}' frontend/coverage/lcov.info)"
          awk -v coverage="$backend_coverage" 'BEGIN {exit !(coverage >= 85)}'
          awk -v coverage="$frontend_coverage" 'BEGIN {exit !(coverage >= 85)}'
          printf 'Backend line coverage: %s%%\nFrontend line coverage: %s%%\n' "$backend_coverage" "$frontend_coverage"

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
