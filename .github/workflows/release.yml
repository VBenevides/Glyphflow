name: Release image

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate release version
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          release_version="${RELEASE_TAG#v}"
          test -n "$version"
          test "$release_version" = "$version" || {
            echo "release tag $RELEASE_TAG does not match VERSION $version" >&2
            exit 1
          }
          echo "GLYPHFLOW_VERSION=$version" >> "$GITHUB_ENV"
          echo "GLYPHFLOW_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Gio Linux dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y pkg-config libegl1-mesa-dev libvulkan-dev libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libxcursor-dev libxfixes-dev

      - name: Install govulncheck
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Run release checks
        env:
          GOVULNCHECK_BIN: ${{ runner.temp }}/bin/govulncheck
        run: ./scripts/release-check.sh

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build image
        run: |
          set -Eeuo pipefail
          docker buildx build --platform linux/amd64 --file build/Dockerfile \
            --tag "$GLYPHFLOW_IMAGE:$GLYPHFLOW_VERSION" \
            --provenance=mode=max --sbom=true --push .
          docker pull "$GLYPHFLOW_IMAGE:$GLYPHFLOW_VERSION"

      - name: Validate deployment topologies
        env:
          NATS_IMAGE_REF: nats@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
          POSTGRES_IMAGE_REF: postgres@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
        run: ./scripts/deployment-check.sh "$GLYPHFLOW_IMAGE:$GLYPHFLOW_VERSION"

      - name: Generate image SBOM
        uses: anchore/sbom-action@43a17d6e7add2b5535efe4dcae9952337c479a93 # v0.20.11
        with:
          image: ${{ env.GLYPHFLOW_IMAGE }}:${{ env.GLYPHFLOW_VERSION }}
          format: spdx-json
          output-file: glyphflow-${{ env.GLYPHFLOW_VERSION }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Verify image license files
        run: |
          set -Eeuo pipefail
          docker run --rm "$GLYPHFLOW_IMAGE:$GLYPHFLOW_VERSION" test -s /usr/share/doc/glyphflow/LICENSE
          docker run --rm "$GLYPHFLOW_IMAGE:$GLYPHFLOW_VERSION" test -s /usr/share/doc/glyphflow/THIRD-PARTY-NOTICES

      - name: Publish image
        run: |
          set -Eeuo pipefail
          docker push "$GLYPHFLOW_IMAGE:$GLYPHFLOW_VERSION"
          if [ "$PRERELEASE" = false ]; then
            docker tag "$GLYPHFLOW_IMAGE:$GLYPHFLOW_VERSION" "$GLYPHFLOW_IMAGE:latest"
            docker push "$GLYPHFLOW_IMAGE:latest"
          fi

      - name: Export offline image
        run: |
          set -Eeuo pipefail
          archive="glyphflow-${GLYPHFLOW_VERSION}-linux-amd64.tar.gz"
          docker save "$GLYPHFLOW_IMAGE:$GLYPHFLOW_VERSION" | gzip -9 > "$archive"
          sha256sum "$archive" > "$archive.sha256"

      - name: Package deployment bundle
        env:
          NATS_IMAGE_REF: nats@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
          POSTGRES_IMAGE_REF: postgres@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
        run: |
          set -Eeuo pipefail
          mkdir -p release
          ./scripts/package-release.sh release "$GLYPHFLOW_VERSION" "$GLYPHFLOW_IMAGE:$GLYPHFLOW_VERSION"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          archive="glyphflow-${GLYPHFLOW_VERSION}-linux-amd64.tar.gz"
          sbom="glyphflow-${GLYPHFLOW_VERSION}-sbom.spdx.json"
          bundle="release/glyphflow-${GLYPHFLOW_VERSION}-deployment.tar.gz"
          bundle_sha="$bundle.sha256"
          test -s "$sbom"
          test -s "$bundle"
          test -s "$bundle_sha"
          gh release upload "$RELEASE_TAG" "$archive" "$archive.sha256" "$bundle" "$bundle_sha" LICENSE THIRD-PARTY-NOTICES "$sbom" --clobber
