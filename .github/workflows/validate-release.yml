name: Validate release image

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSE_PROJECT_NAME: glyphflow-validation
  GLYPHFLOW_PORT: 8088

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set image tag
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test -n "$version"
          echo "GLYPHFLOW_VERSION=$version" >> "$GITHUB_ENV"
          echo "GLYPHFLOW_IMAGE=glyphflow:$version" >> "$GITHUB_ENV"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install govulncheck
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Run release checks
        env:
          GOVULNCHECK_BIN: ${{ runner.temp }}/bin/govulncheck
        run: ./scripts/release-check.sh

      - name: Build image
        run: docker build --platform linux/amd64 --file build/Dockerfile --tag "$GLYPHFLOW_IMAGE" .

      - name: Validate deployment topologies
        env:
          NATS_IMAGE_REF: nats@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
          POSTGRES_IMAGE_REF: postgres@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
        run: ./scripts/deployment-check.sh "$GLYPHFLOW_IMAGE"

      - name: Smoke test image
        run: |
          set -Eeuo pipefail
          docker compose up -d --wait
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused "http://127.0.0.1:${GLYPHFLOW_PORT}/api/v1/healthz"
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused "http://127.0.0.1:${GLYPHFLOW_PORT}/api/v1/readyz"

      - name: Export image
        run: |
          set -Eeuo pipefail
          archive="glyphflow-${GLYPHFLOW_VERSION}-linux-amd64.tar.gz"
          docker save "$GLYPHFLOW_IMAGE" | gzip -9 > "$archive"
          sha256sum "$archive" > "$archive.sha256"
          sha256sum -c "$archive.sha256"

      - name: Upload validation artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: glyphflow-validation-${{ github.run_id }}
          path: glyphflow-*-linux-amd64.tar.gz*
          if-no-files-found: error
          retention-days: 7

      - name: Tear down validation stack
        if: always()
        run: docker compose down --volumes --remove-orphans
