# Production overlay. Keep compose.yaml as the local-development quick start.
name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME must be unique per client}

networks:
  default:
    internal: true

services:
  controlplane:
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        set -eu
        export DATABASE_URL="$$(cat /run/secrets/database-url)"
        export NATS_URL="$$(cat /run/secrets/nats-url)"
        export ACCESS_TOKEN_SECRET="$$(cat /run/secrets/access-token-secret)"
        export CONTROL_PLANE_SIGNING_PRIVATE_KEY="$$(cat /run/secrets/control-plane-signing-key)"
        export PASSWORD_PEPPER="$$(cat /run/secrets/password-pepper)"
        export GLYPHFLOW_BOOTSTRAP_PASSWORD="$$(cat /run/secrets/bootstrap-password)"
        exec /usr/local/bin/glyphflow-controlplane
    environment: !override
      NATS_CERT_FILE: /run/secrets/nats-cert
      NATS_KEY_FILE: /run/secrets/nats-key
      NATS_CA_FILE: /run/secrets/nats-ca
      PGSSLROOTCERT: /run/secrets/postgres-ca
      SECRET_ENCRYPTION_KEY_FILE: /run/secrets/secret-encryption-key
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN must be set to an https origin}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN must be an explicit allowlist}
      CSRF_ORIGINS: ${CSRF_ORIGINS:?CSRF_ORIGINS must be set}
      ENVIRONMENT: production
      ALLOW_INSECURE_TRANSPORT: "false"
      DATA_DIR: /data
      DATABASE_STORAGE_CAPACITY_BYTES: ${DATABASE_STORAGE_CAPACITY_BYTES:?DATABASE_STORAGE_CAPACITY_BYTES must be set}
      MAX_MESSAGE_BYTES: ${MAX_MESSAGE_BYTES:-1048576}
      GLYPHFLOW_BOOTSTRAP_EMAIL: ${GLYPHFLOW_BOOTSTRAP_EMAIL:?GLYPHFLOW_BOOTSTRAP_EMAIL must be set}
      GLYPHFLOW_SYSTEM_ADMINS: ${GLYPHFLOW_SYSTEM_ADMINS:?GLYPHFLOW_SYSTEM_ADMINS must be set}
      ENABLE_PASSWORD_LOGIN: ${ENABLE_PASSWORD_LOGIN:-false}
      ENABLE_PASSWORD_REGISTRATION: ${ENABLE_PASSWORD_REGISTRATION:-false}
      DEFAULT_ROLE_ID: ${DEFAULT_ROLE_ID:-system-user}
      RUNNER_NATS_URL: ""
      RUNNER_CONTROL_PLANE_URL: ""
      RUNNER_BINARIES_DIR: /app/runner-binaries
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    volumes: !override
      - type: volume
        source: glyphflow-data
        target: /data
        read_only: true
    secrets:
      - source: database-url
        target: /run/secrets/database-url
        uid: "65532"
        gid: "65532"
        mode: 0400
      - source: nats-url
        target: /run/secrets/nats-url
        uid: "65532"
        gid: "65532"
        mode: 0400
      - source: access-token-secret
        target: /run/secrets/access-token-secret
        uid: "65532"
        gid: "65532"
        mode: 0400
      - source: control-plane-signing-key
        target: /run/secrets/control-plane-signing-key
        uid: "65532"
        gid: "65532"
        mode: 0400
      - source: password-pepper
        target: /run/secrets/password-pepper
        uid: "65532"
        gid: "65532"
        mode: 0400
      - source: secret-encryption-key
        target: /run/secrets/secret-encryption-key
        uid: "65532"
        gid: "65532"
        mode: 0400
      - source: bootstrap-password
        target: /run/secrets/bootstrap-password
        uid: "65532"
        gid: "65532"
        mode: 0400
      - source: nats-cert
        target: /run/secrets/nats-cert
        uid: "65532"
        gid: "65532"
        mode: 0400
      - source: nats-key
        target: /run/secrets/nats-key
        uid: "65532"
        gid: "65532"
        mode: 0400
      - source: nats-ca
        target: /run/secrets/nats-ca
        uid: "65532"
        gid: "65532"
        mode: 0440
      - source: postgres-ca
        target: /run/secrets/postgres-ca
        uid: "65532"
        gid: "65532"
        mode: 0440

  web:
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
          pids: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=101,mode=0700
      - /var/run:rw,noexec,nosuid,nodev,size=1m,uid=101,gid=101,mode=0700
    ports: !override
      - "127.0.0.1:${GLYPHFLOW_PORT:?GLYPHFLOW_PORT must be set}:80"

  postgres:
    user: "70:70"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
          pids: 256
    environment: !override
      POSTGRES_DB: glyphflow
      POSTGRES_USER: glyphflow
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/secrets/postgres-cert
      - -c
      - ssl_key_file=/run/secrets/postgres-key
      - -c
      - ssl_ca_file=/run/secrets/postgres-ca
    ports: !override []
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=70,gid=70,mode=1770
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=16m,uid=70,gid=70,mode=0700
    volumes: !override
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql/data
        read_only: false
    secrets:
      - source: postgres-password
        target: /run/secrets/postgres-password
        uid: "70"
        gid: "70"
        mode: 0400
      - source: postgres-cert
        target: /run/secrets/postgres-cert
        uid: "70"
        gid: "70"
        mode: 0400
      - source: postgres-key
        target: /run/secrets/postgres-key
        uid: "70"
        gid: "70"
        mode: 0400
      - source: postgres-ca
        target: /run/secrets/postgres-ca
        uid: "70"
        gid: "70"
        mode: 0440

  nats:
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 256
    command:
      - --jetstream
      - --store_dir
      - /data
      - --http_port
      - "8222"
      - --tls
      - --tlscert
      - /run/secrets/nats-cert
      - --tlskey
      - /run/secrets/nats-key
      - --tlscacert
      - /run/secrets/nats-ca
      - --tlsverify
    ports: !override []
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=1770
    volumes: !override
      - type: volume
        source: nats-data
        target: /data
        read_only: false
    secrets:
      - source: nats-cert
        target: /run/secrets/nats-cert
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: nats-key
        target: /run/secrets/nats-key
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: nats-ca
        target: /run/secrets/nats-ca
        uid: "1000"
        gid: "1000"
        mode: 0440

secrets:
  database-url:
    file: ${DATABASE_URL_FILE:?DATABASE_URL_FILE must point to a protected connection URL}
  nats-url:
    file: ${NATS_URL_FILE:?NATS_URL_FILE must point to a protected NATS URL}
  access-token-secret:
    file: ${ACCESS_TOKEN_SECRET_FILE:?ACCESS_TOKEN_SECRET_FILE must point to a protected secret}
  control-plane-signing-key:
    file: ${CONTROL_PLANE_SIGNING_PRIVATE_KEY_FILE:?CONTROL_PLANE_SIGNING_PRIVATE_KEY_FILE must point to a protected key}
  password-pepper:
    file: ${PASSWORD_PEPPER_FILE:?PASSWORD_PEPPER_FILE must point to a protected secret}
  secret-encryption-key:
    file: ${SECRET_ENCRYPTION_KEY_FILE:?SECRET_ENCRYPTION_KEY_FILE must point to a protected key}
  bootstrap-password:
    file: ${GLYPHFLOW_BOOTSTRAP_PASSWORD_FILE:?GLYPHFLOW_BOOTSTRAP_PASSWORD_FILE must point to a protected secret}
  postgres-password:
    file: ${POSTGRES_PASSWORD_FILE:?POSTGRES_PASSWORD_FILE must point to a protected secret file}
  postgres-cert:
    file: ${POSTGRES_CERT_SOURCE:?POSTGRES_CERT_SOURCE must point to a certificate}
  postgres-key:
    file: ${POSTGRES_KEY_SOURCE:?POSTGRES_KEY_SOURCE must point to a private key}
  postgres-ca:
    file: ${POSTGRES_CA_SOURCE:?POSTGRES_CA_SOURCE must point to a CA certificate}
  nats-cert:
    file: ${NATS_CERT_SOURCE:?NATS_CERT_SOURCE must point to a certificate}
  nats-key:
    file: ${NATS_KEY_SOURCE:?NATS_KEY_SOURCE must point to a private key}
  nats-ca:
    file: ${NATS_CA_SOURCE:?NATS_CA_SOURCE must point to a CA certificate}
