services:
  controlplane:
    image: ${GLYPHFLOW_IMAGE:-glyphflow:latest}
    working_dir: /app
    command: ["/usr/local/bin/glyphflow-controlplane"]
    environment:
      DATABASE_URL: postgres://glyphflow:glyphflow@postgres:5432/glyphflow?sslmode=disable
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      RUNNER_NATS_URL: ${RUNNER_NATS_URL:-nats://nats:4222}
      RUNNER_CONTROL_PLANE_URL: ${RUNNER_CONTROL_PLANE_URL:-}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-development-secret-at-least-32-characters}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:-development-password-pepper-at-least-16}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://localhost:5173,http://127.0.0.1:5173}
      CSRF_ORIGINS: ${CSRF_ORIGINS:-http://localhost,http://localhost:5173,http://127.0.0.1:5173}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ALLOW_INSECURE_TRANSPORT: ${ALLOW_INSECURE_TRANSPORT:-true}
      DATA_DIR: /data
      MAX_MESSAGE_BYTES: ${MAX_MESSAGE_BYTES:-1048576}
      GLYPHFLOW_BOOTSTRAP_EMAIL: ${GLYPHFLOW_BOOTSTRAP_EMAIL:-admin@example_domain.com}
      GLYPHFLOW_BOOTSTRAP_PASSWORD: ${GLYPHFLOW_BOOTSTRAP_PASSWORD:-admin-password-123}
      GLYPHFLOW_SYSTEM_ADMINS: ${GLYPHFLOW_SYSTEM_ADMINS:-admin@example_domain.com}
      ENABLE_PASSWORD_LOGIN: ${ENABLE_PASSWORD_LOGIN:-true}
      ENABLE_PASSWORD_REGISTRATION: ${ENABLE_PASSWORD_REGISTRATION:-true}
      DEFAULT_ROLE_ID: ${DEFAULT_ROLE_ID:-system-user}
      RUNNER_BINARIES_DIR: /app/runner-binaries
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - glyphflow-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/api/v1/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    image: ${GLYPHFLOW_IMAGE:-glyphflow:latest}
    depends_on:
      controlplane:
        condition: service_healthy
    ports:
      - "${GLYPHFLOW_PORT:-80}:80"

  postgres:
    image: ${POSTGRES_IMAGE:-postgres@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6}
    environment:
      POSTGRES_DB: glyphflow
      POSTGRES_USER: glyphflow
      POSTGRES_PASSWORD: glyphflow
    ports:
      - "${POSTGRES_HOST_PORT:-127.0.0.1:5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U glyphflow -d glyphflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: ${NATS_IMAGE:-nats@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927}
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "${NATS_HOST_PORT:-127.0.0.1:4222}:4222"
      - "${NATS_MONITOR_HOST_PORT:-127.0.0.1:8222}:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  glyphflow-data:
  postgres-data:
  nats-data:
