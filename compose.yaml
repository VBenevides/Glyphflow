services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: glyphflow
      POSTGRES_USER: glyphflow
      POSTGRES_PASSWORD: glyphflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glyphflow -d glyphflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["--jetstream", "--store_dir", "/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

volumes:
  postgres-data:
  nats-data:
